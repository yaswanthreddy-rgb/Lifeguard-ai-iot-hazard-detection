server.port=8080

# ---------- Database: H2 file database (works immediately) ----------
spring.datasource.url=jdbc:h2:file:./data/lifeguard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# ---------- To use MySQL instead: comment the H2 lines above and uncomment these ----------
# (create the database first:  CREATE DATABASE lifeguard;)
#spring.datasource.url=jdbc:mysql://localhost:3306/lifeguard
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=YOUR_MYSQL_PASSWORD

# ---------- Alert limits (same idea as the ESP32 code) ----------
lifeguard.temp-limit=50
lifeguard.gas-limit=2000

# ---------- Emergency notifications ----------
# Set these environment variables to enable SMS and voice alerts.
lifeguard.notifications.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
lifeguard.notifications.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
lifeguard.notifications.twilio.from-number=${TWILIO_FROM_NUMBER:}
lifeguard.notifications.recipients.police=${LIFEGUARD_POLICE_NUMBERS:}
lifeguard.notifications.recipients.hospital=${LIFEGUARD_HOSPITAL_NUMBERS:}
lifeguard.notifications.recipients.fire-station=${LIFEGUARD_FIRE_STATION_NUMBERS:}
lifeguard.notifications.recipients.neighbours=${LIFEGUARD_NEIGHBOUR_NUMBERS:}
